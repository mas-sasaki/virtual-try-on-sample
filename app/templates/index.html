<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Virtual Try-On API テスト</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    section { margin: 24px 0; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
    h2 { font-size: 1rem; margin: 0 0 12px; }
    button { padding: 8px 16px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    img { max-width: 100%; margin-top: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .status { margin-top: 8px; font-size: 0.875rem; color: #555; }
    .error { color: #c00; }

    /* タブ */
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { padding: 6px 14px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; background: #f5f5f5; }
    .tab.active { background: #333; color: #fff; border-color: #333; }

    /* マネキン・衣服グリッド共通 */
    .item-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .item-card {
      width: 110px; cursor: pointer; border: 2px solid #ddd; border-radius: 6px;
      padding: 6px; text-align: center; font-size: 0.75rem;
    }
    .item-card.selected { border-color: #333; background: #f0f0f0; }
    .item-card img { width: 100%; height: 120px; object-fit: cover; border: none; margin: 0 0 4px; border-radius: 3px; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 0.7rem; margin-bottom: 4px;
    }
    .badge-male   { background: #dbeafe; color: #1e40af; }
    .badge-female { background: #fce7f3; color: #9d174d; }

    /* 衣服2カラム */
    .garment-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
    .garment-col h3 { font-size: 0.9rem; margin: 0 0 8px; padding-bottom: 4px; border-bottom: 1px solid #eee; }
    .selected-info { font-size: 0.8rem; color: #555; margin-top: 6px; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Virtual Try-On API テスト UI</h1>

  <!-- Step 1: 人物 -->
  <section>
    <h2>Step 1: 人物を選択</h2>
    <div class="tabs">
      <div class="tab active" id="tabUpload" onclick="switchTab('upload')">写真をアップロード</div>
      <div class="tab" id="tabMannequin" onclick="switchTab('mannequin')">マネキンを選択</div>
    </div>

    <div id="panelUpload">
      <input type="file" id="personFile" accept="image/jpeg,image/png">
      <button onclick="uploadPerson()">アップロード</button>
      <div class="status" id="uploadStatus"></div>
      <img id="personPreview" style="display:none; max-height:280px;">
    </div>

    <div id="panelMannequin" style="display:none;">
      <button onclick="loadMannequins()">マネキン一覧を取得</button>
      <div id="mannequinStatus" class="status"></div>
      <div id="mannequinGrid" class="item-grid"></div>
    </div>
  </section>

  <!-- Step 2: 衣服 -->
  <section>
    <h2>Step 2: 衣服を選択（トップス・ボトムスのどちらか、または両方）</h2>
    <button onclick="loadGarments()">衣服一覧を取得</button>
    <div class="garment-cols" id="garmentCols" style="display:none;">
      <div class="garment-col">
        <h3>トップス</h3>
        <div id="topsGrid" class="item-grid"></div>
        <div class="selected-info" id="topInfo">未選択</div>
      </div>
      <div class="garment-col">
        <h3>ボトムス</h3>
        <div id="bottomsGrid" class="item-grid"></div>
        <div class="selected-info" id="bottomInfo">未選択</div>
      </div>
    </div>
  </section>

  <!-- Step 3: 試着 -->
  <section>
    <h2>Step 3: 試着する</h2>
    <button onclick="runTryOn()" id="tryonBtn" disabled>試着する</button>
    <div class="status" id="tryonStatus"></div>
    <img id="resultImage" style="display:none; max-height:500px;">
  </section>

  <script>
    let personGcsUri = null;
    let topGcsUri    = null;
    let bottomGcsUri = null;

    // ---- タブ切替 ----
    function switchTab(tab) {
      document.getElementById('tabUpload').classList.toggle('active', tab === 'upload');
      document.getElementById('tabMannequin').classList.toggle('active', tab === 'mannequin');
      document.getElementById('panelUpload').style.display    = tab === 'upload'    ? '' : 'none';
      document.getElementById('panelMannequin').style.display = tab === 'mannequin' ? '' : 'none';
      personGcsUri = null;
      document.getElementById('personPreview').style.display = 'none';
      document.getElementById('mannequinGrid').innerHTML = '';
      updateTryonBtn();
    }

    // ---- アップロード ----
    async function uploadPerson() {
      const file = document.getElementById('personFile').files[0];
      if (!file) { alert('ファイルを選択してください'); return; }
      const status = document.getElementById('uploadStatus');
      status.textContent = 'アップロード中...';
      status.className = 'status';
      const form = new FormData();
      form.append('file', file);
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
        const data = await res.json();
        personGcsUri = data.gcs_uri;
        status.textContent = `完了: ${data.gcs_uri}`;
        const img = document.getElementById('personPreview');
        img.src = data.image_url;
        img.style.display = 'block';
        updateTryonBtn();
      } catch (e) {
        status.textContent = `エラー: ${e.message}`;
        status.className = 'status error';
      }
    }

    // ---- マネキン ----
    async function loadMannequins() {
      const status = document.getElementById('mannequinStatus');
      status.textContent = '取得中...';
      try {
        const res = await fetch('/api/mannequins');
        if (!res.ok) throw new Error(await res.text());
        const items = await res.json();
        status.textContent = '';
        const grid = document.getElementById('mannequinGrid');
        grid.innerHTML = '';
        if (!items.length) { status.textContent = 'マネキン画像がありません'; return; }
        items.forEach(m => {
          const label = m.gender === 'female' ? '女性' : '男性';
          const badgeClass = m.gender === 'female' ? 'badge-female' : 'badge-male';
          const card = makeCard(m.gcs_uri, m.image_url, m.name, label, badgeClass);
          card.onclick = () => {
            document.querySelectorAll('#mannequinGrid .item-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            personGcsUri = m.gcs_uri;
            updateTryonBtn();
          };
          grid.appendChild(card);
        });
      } catch (e) {
        status.textContent = `エラー: ${e.message}`;
        status.className = 'status error';
      }
    }

    // ---- 衣服 ----
    async function loadGarments() {
      const [topsRes, bottomsRes] = await Promise.all([
        fetch('/api/garments?category=tops'),
        fetch('/api/garments?category=bottoms'),
      ]);
      const tops    = await topsRes.json();
      const bottoms = await bottomsRes.json();

      renderGarmentGrid('topsGrid',    tops,    'topGcsUri',    'topInfo');
      renderGarmentGrid('bottomsGrid', bottoms, 'bottomGcsUri', 'bottomInfo');
      document.getElementById('garmentCols').style.display = '';
    }

    function renderGarmentGrid(gridId, items, uriVar, infoId) {
      const grid = document.getElementById(gridId);
      grid.innerHTML = '';
      items.forEach(g => {
        const label = g.name.replace(/^(tops|bottoms)\//, '').replace('.png', '');
        const card = makeCard(g.gcs_uri, g.image_url, label);
        card.onclick = () => {
          grid.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          if (uriVar === 'topGcsUri')    { topGcsUri    = g.gcs_uri; }
          if (uriVar === 'bottomGcsUri') { bottomGcsUri = g.gcs_uri; }
          document.getElementById(infoId).textContent = label;
          updateTryonBtn();
        };
        grid.appendChild(card);
      });
    }

    // ---- カード生成ヘルパー ----
    function makeCard(uri, imageUrl, label, badgeText, badgeClass) {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.dataset.uri = uri;
      const badge = badgeText
        ? `<span class="badge ${badgeClass}">${badgeText}</span><br>`
        : '';
      card.innerHTML = `${badge}<img src="${imageUrl}" alt="${label}"><div>${label}</div>`;
      return card;
    }

    function updateTryonBtn() {
      const hasGarment = topGcsUri || bottomGcsUri;
      document.getElementById('tryonBtn').disabled = !(personGcsUri && hasGarment);
    }

    // ---- 試着 ----
    async function runTryOn() {
      const status = document.getElementById('tryonStatus');
      const both = topGcsUri && bottomGcsUri;
      status.textContent = both
        ? '試着処理中... トップス→ボトムスの順に2回処理します（最大2分程度）'
        : '試着処理中... (最大1分程度かかります)';
      status.className = 'status';
      document.getElementById('tryonBtn').disabled = true;
      document.getElementById('resultImage').style.display = 'none';
      try {
        const body = { person_gcs_uri: personGcsUri };
        if (topGcsUri)    body.top_gcs_uri    = topGcsUri;
        if (bottomGcsUri) body.bottom_gcs_uri = bottomGcsUri;

        const res = await fetch('/api/tryon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
        const data = await res.json();
        status.textContent = `完了: ${data.result_gcs_uri}`;
        const img = document.getElementById('resultImage');
        img.src = data.result_url;
        img.style.display = 'block';
      } catch (e) {
        status.textContent = `エラー: ${e.message}`;
        status.className = 'status error';
      } finally {
        document.getElementById('tryonBtn').disabled = false;
      }
    }
  </script>
</body>
</html>
