<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #4f46e5;
      --primary-h:    #4338ca;
      --bg:           #f1f5f9;
      --surface:      #ffffff;
      --surface-2:    #f8fafc;
      --border:       #e2e8f0;
      --text:         #0f172a;
      --text-muted:   #64748b;
      --male-bg:      #dbeafe; --male-fg:   #1d4ed8;
      --female-bg:    #fce7f3; --female-fg: #be185d;
      --radius:       12px;
      --radius-sm:    8px;
      --shadow:       0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:    0 4px 6px -1px rgba(0,0,0,.08), 0 2px 4px -1px rgba(0,0,0,.04);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ---- Header ---- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow);
    }
    .header-icon {
      width: 34px; height: 34px;
      background: var(--primary);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 17px;
    }
    header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
    .header-badge {
      margin-left: 4px;
      padding: 2px 8px;
      background: #ede9fe;
      color: var(--primary);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    /* ---- Layout ---- */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---- Card ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .step-num {
      width: 26px; height: 26px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-title { font-size: 0.95rem; font-weight: 600; }
    .step-sub { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }

    /* ---- Tabs ---- */
    .tabs {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 7px 0;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: all .15s;
    }
    .tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow);
      font-weight: 600;
    }

    /* ---- Item grids ---- */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .item-card {
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .1s, box-shadow .15s, opacity .2s;
      position: relative;
      background: var(--surface-2);
    }
    .item-card:hover { border-color: #a5b4fc; transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .item-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px #e0e7ff; }
    .item-card.selected .check { opacity: 1; transform: scale(1); }

    .item-card .thumb {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background: #f1f5f9;
    }
    .item-card.square .thumb { aspect-ratio: 1/1; }

    .item-card .label {
      padding: 5px 6px;
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--surface);
    }

    .check {
      position: absolute;
      top: 6px; right: 6px;
      width: 20px; height: 20px;
      background: var(--primary);
      border-radius: 50%;
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      opacity: 0;
      transform: scale(.5);
      transition: all .15s;
    }

    .badge {
      position: absolute;
      top: 6px; left: 6px;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .badge-male   { background: var(--male-bg);   color: var(--male-fg); }
    .badge-female { background: var(--female-bg); color: var(--female-fg); }

    /* ---- Garment locked state ---- */
    .garments-locked .item-card {
      pointer-events: none;
      opacity: 0.45;
      cursor: not-allowed;
    }
    .garments-locked .item-card.selected { opacity: 0.8; }

    /* ---- Garment two-col ---- */
    .garment-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .garment-col-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .garment-col-title .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-top    { background: #818cf8; }
    .dot-bottom { background: #34d399; }

    /* ---- Upload area ---- */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
    }
    .upload-area:hover { border-color: #a5b4fc; background: #f5f3ff; }
    .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-icon { font-size: 2rem; margin-bottom: 8px; }
    .upload-area p { font-size: 0.8rem; color: var(--text-muted); }
    .upload-area strong { color: var(--primary); }

    .btn-upload {
      margin-top: 12px;
      width: 100%;
      padding: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background .15s;
    }
    .btn-upload:hover { background: #ede9fe; color: var(--primary); }

    /* ---- Person preview ---- */
    .person-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-top: 12px;
    }
    .person-preview img { width: 54px; height: 72px; object-fit: cover; border-radius: 6px; }
    .person-preview .pinfo { flex: 1; }
    .person-preview .pname { font-size: 0.8rem; font-weight: 600; }
    .person-preview .psub  { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .person-preview .pchange {
      font-size: 0.75rem;
      color: var(--primary);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 8px;
    }

    /* ---- Notice ---- */
    .notice-msg {
      font-size: 0.8rem;
      color: #b45309;
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      margin-bottom: 12px;
      display: none;
    }

    /* ---- Applied chips ---- */
    .applied-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .applied-chip {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .chip-top    { background: #ede9fe; color: var(--primary); }
    .chip-bottom { background: #d1fae5; color: #065f46; }

    /* ---- Status / loading ---- */
    .status-msg {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.2em;
    }
    .status-msg.error { color: #ef4444; }

    .spinner {
      display: none;
      margin: 12px auto;
      width: 32px; height: 32px;
      border: 3px solid #e0e7ff;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Before/After comparison ---- */
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 4px;
    }

    .comparison-col-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      padding: 6px 0;
      margin-bottom: 8px;
      border-bottom: 2px solid var(--border);
      letter-spacing: .03em;
    }
    .comparison-col-label.label-after {
      color: var(--primary);
      border-color: #c7d2fe;
    }

    .image-wrap {
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-2);
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-placeholder {
      text-align: center;
      color: #cbd5e1;
      padding: 28px 16px;
    }
    .image-placeholder .pi { font-size: 2.5rem; margin-bottom: 8px; }
    .image-placeholder p { font-size: 0.78rem; }
    .compare-img { width: 100%; display: block; }

    /* ---- Skeleton ---- */
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skeleton-card { height: 140px; }

    /* ---- Reset button ---- */
    .btn-reset {
      margin-top: 14px;
      width: 100%;
      padding: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: background .15s, color .15s, border-color .15s;
    }
    .btn-reset:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

    /* ---- Chain hint ---- */
    .chain-hint {
      font-size: 0.75rem;
      color: var(--primary);
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <div class="header-icon">👗</div>
  <div>
    <h1>Virtual Try-On <span class="header-badge">Demo</span></h1>
  </div>
</header>

<main>

  <!-- Step 1: Person -->
  <div class="card">
    <div class="step-header">
      <div class="step-num">1</div>
      <div class="step-title">人物を選択</div>
      <div class="step-sub" id="personStepSub"></div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabMannequin" onclick="switchTab('mannequin')">マネキンを選択</div>
      <div class="tab" id="tabUpload" onclick="switchTab('upload')">写真をアップロード</div>
    </div>

    <!-- マネキン -->
    <div id="panelMannequin">
      <div id="mannequinGrid" class="item-grid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
      <div class="status-msg" id="mannequinStatus"></div>
    </div>

    <!-- アップロード -->
    <div id="panelUpload" style="display:none;">
      <div class="upload-area" id="uploadArea">
        <input type="file" id="personFile" accept="image/jpeg,image/png" onchange="handleFileChange()">
        <div class="upload-icon">📷</div>
        <p><strong>クリックして画像を選択</strong></p>
        <p>JPG / PNG（全身写真推奨）</p>
      </div>
      <button class="btn-upload" id="btnUpload" onclick="uploadPerson()" style="display:none;">アップロード</button>
      <div class="status-msg" id="uploadStatus"></div>
    </div>

    <!-- 人物選択済みプレビュー -->
    <div class="person-preview" id="personPreview" style="display:none;">
      <img id="personThumb" src="" alt="person">
      <div class="pinfo">
        <div class="pname" id="personName">—</div>
        <div class="psub">選択済み</div>
      </div>
      <button class="pchange" onclick="clearPerson()">変更</button>
    </div>
  </div>

  <!-- Step 2: Garments -->
  <div class="card">
    <div class="step-header">
      <div class="step-num">2</div>
      <div class="step-title">衣服を選択</div>
      <div class="step-sub">選ぶと自動で試着します</div>
    </div>

    <div class="notice-msg" id="garmentNoPerson">先に人物を選択してください</div>

    <div id="garmentSection">
      <div class="garment-cols">
        <div>
          <div class="garment-col-title">
            <span class="dot dot-top"></span> トップス
          </div>
          <div id="topsGrid" class="item-grid">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
        </div>
        <div>
          <div class="garment-col-title">
            <span class="dot dot-bottom"></span> ボトムス
          </div>
          <div id="bottomsGrid" class="item-grid">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
        </div>
      </div>
      <div class="chain-hint" id="chainHint">✨ 衣服を変更・追加できます</div>
    </div>
  </div>

  <!-- Step 3: Before / After -->
  <div class="card">
    <div class="step-header" style="margin-bottom:8px;">
      <div class="step-num">3</div>
      <div class="step-title">試着結果</div>
    </div>

    <!-- Applied chips + status -->
    <div class="applied-chips" id="appliedChips" style="display:none;"></div>
    <div class="spinner" id="spinner"></div>
    <div class="status-msg" id="tryonStatus" style="margin-bottom:8px;"></div>

    <!-- Before / After side by side -->
    <div class="comparison-grid">
      <div>
        <div class="comparison-col-label">試着前</div>
        <div class="image-wrap" id="beforeWrap">
          <div class="image-placeholder">
            <div class="pi">👤</div>
            <p>人物を選択してください</p>
          </div>
        </div>
      </div>
      <div>
        <div class="comparison-col-label label-after">試着後</div>
        <div class="image-wrap" id="resultWrap">
          <div class="image-placeholder">
            <div class="pi">✨</div>
            <p>衣服を選ぶと自動で試着します</p>
          </div>
        </div>
      </div>
    </div>

    <button class="btn-reset" id="btnReset" onclick="resetTryon()" style="display:none;">
      ↺ 最初からやり直す
    </button>
  </div>

</main>

<script>
  // ===== State =====
  let originalPersonGcsUri = null;
  let originalPersonImgUrl = null;
  let originalPersonLabel  = null;
  let isTryingOn           = false;
  let selectedTop          = null; // {gcsUri, label}
  let selectedBottom       = null; // {gcsUri, label}

  // ===== Init =====
  document.addEventListener('DOMContentLoaded', () => {
    switchTab('mannequin');
    loadMannequins();
    loadGarments();
  });

  // ===== Tab =====
  function switchTab(tab) {
    document.getElementById('tabMannequin').classList.toggle('active', tab === 'mannequin');
    document.getElementById('tabUpload').classList.toggle('active', tab === 'upload');
    document.getElementById('panelMannequin').style.display = tab === 'mannequin' ? '' : 'none';
    document.getElementById('panelUpload').style.display    = tab === 'upload'    ? '' : 'none';
    if (tab !== 'upload') clearUploadPanel();
    if (tab !== 'mannequin') {
      document.querySelectorAll('#mannequinGrid .item-card').forEach(c => c.classList.remove('selected'));
    }
    clearPerson();
  }

  function clearUploadPanel() {
    document.getElementById('personFile').value = '';
    document.getElementById('uploadStatus').textContent = '';
    document.getElementById('btnUpload').style.display = 'none';
  }

  function clearPerson() {
    originalPersonGcsUri = originalPersonImgUrl = originalPersonLabel = null;
    document.getElementById('personPreview').style.display = 'none';
    document.getElementById('personStepSub').textContent = '';
    document.getElementById('beforeWrap').innerHTML = `
      <div class="image-placeholder">
        <div class="pi">👤</div>
        <p>人物を選択してください</p>
      </div>`;
    resetTryonState(true);
  }

  // ===== Upload =====
  function handleFileChange() {
    const file = document.getElementById('personFile').files[0];
    document.getElementById('btnUpload').style.display = file ? '' : 'none';
    if (file) document.getElementById('uploadArea').querySelectorAll('p')[0].textContent = file.name;
  }

  async function uploadPerson() {
    const file = document.getElementById('personFile').files[0];
    if (!file) return;
    const status = document.getElementById('uploadStatus');
    const btn = document.getElementById('btnUpload');
    status.textContent = 'アップロード中...';
    status.className = 'status-msg';
    btn.disabled = true;
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
      const data = await res.json();
      setPerson(data.gcs_uri, data.image_url, file.name.replace(/\.[^.]+$/, ''));
      status.textContent = '';
    } catch (e) {
      status.textContent = `エラー: ${e.message}`;
      status.className = 'status-msg error';
    } finally {
      btn.disabled = false;
    }
  }

  // ===== Mannequins =====
  async function loadMannequins() {
    try {
      const res = await fetch('/api/mannequins');
      if (!res.ok) throw new Error(await res.text());
      const items = await res.json();
      const grid = document.getElementById('mannequinGrid');
      grid.innerHTML = '';
      if (!items.length) {
        grid.innerHTML = '<p style="color:#94a3b8;font-size:.8rem;">マネキン画像がありません</p>';
        return;
      }
      items.forEach(m => {
        const label = m.gender === 'female' ? '女性' : '男性';
        const bClass = m.gender === 'female' ? 'badge-female' : 'badge-male';
        const card = makeCard({ imageUrl: m.image_url, label: m.name, badge: label, badgeClass: bClass });
        card.onclick = () => {
          document.querySelectorAll('#mannequinGrid .item-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          setPerson(m.gcs_uri, m.image_url, `${label}マネキン`);
        };
        grid.appendChild(card);
      });
    } catch (e) {
      document.getElementById('mannequinStatus').textContent = `取得失敗: ${e.message}`;
    }
  }

  // ===== Garments =====
  async function loadGarments() {
    const [topsRes, bottomsRes] = await Promise.all([
      fetch('/api/garments?category=tops'),
      fetch('/api/garments?category=bottoms'),
    ]);
    const tops    = topsRes.ok    ? await topsRes.json()    : [];
    const bottoms = bottomsRes.ok ? await bottomsRes.json() : [];
    renderGarmentGrid('topsGrid',    tops,    'top');
    renderGarmentGrid('bottomsGrid', bottoms, 'bottom');
  }

  function renderGarmentGrid(gridId, items, kind) {
    const grid = document.getElementById(gridId);
    grid.innerHTML = '';
    if (!items.length) {
      grid.innerHTML = '<p style="color:#94a3b8;font-size:.8rem;">画像がありません</p>';
      return;
    }
    items.forEach(g => {
      const displayLabel = g.name.replace(/^(tops|bottoms)\//, '').replace(/\.png$/, '');
      const card = makeCard({ imageUrl: g.image_url, label: displayLabel, square: true });
      card.onclick = () => garmentClicked(card, grid, g.gcs_uri, displayLabel, kind);
      grid.appendChild(card);
    });
  }

  function garmentClicked(card, grid, gcsUri, label, kind) {
    if (isTryingOn) return;
    if (!originalPersonGcsUri) {
      showNoPersonHint();
      return;
    }
    grid.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    if (kind === 'top')  selectedTop    = { gcsUri, label };
    else                 selectedBottom = { gcsUri, label };
    runTryOn();
  }

  // ===== Helpers =====
  function makeCard({ imageUrl, label, badge, badgeClass, square }) {
    const card = document.createElement('div');
    card.className = 'item-card' + (square ? ' square' : '');
    card.innerHTML = `
      <img class="thumb" src="${imageUrl}" alt="${label}" loading="lazy">
      ${badge ? `<span class="badge ${badgeClass}">${badge}</span>` : ''}
      <div class="check">✓</div>
      <div class="label">${label}</div>`;
    return card;
  }

  function setPerson(uri, imageUrl, label) {
    originalPersonGcsUri = uri;
    originalPersonImgUrl = imageUrl;
    originalPersonLabel  = label;
    document.getElementById('personThumb').src = imageUrl;
    document.getElementById('personName').textContent = label;
    document.getElementById('personPreview').style.display = 'flex';
    document.getElementById('personStepSub').textContent = `✓ ${label}`;
    document.getElementById('beforeWrap').innerHTML =
      `<img class="compare-img" src="${imageUrl}" alt="試着前">`;
    resetTryonState(true);
  }

  function showNoPersonHint() {
    const el = document.getElementById('garmentNoPerson');
    el.style.display = '';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.display = 'none'; }, 2500);
  }

  // ===== Garment lock/unlock =====
  function lockGarments() {
    isTryingOn = true;
    document.getElementById('garmentSection').classList.add('garments-locked');
  }

  function unlockGarments() {
    isTryingOn = false;
    document.getElementById('garmentSection').classList.remove('garments-locked');
  }

  function clearGarmentSelection() {
    document.querySelectorAll('#topsGrid .item-card, #bottomsGrid .item-card')
      .forEach(c => c.classList.remove('selected'));
  }

  // ===== Reset =====
  function resetTryonState(clearResult) {
    selectedTop = null;
    selectedBottom = null;
    clearGarmentSelection();
    document.getElementById('appliedChips').innerHTML = '';
    document.getElementById('appliedChips').style.display = 'none';
    document.getElementById('chainHint').style.display = 'none';
    document.getElementById('btnReset').style.display = 'none';
    document.getElementById('tryonStatus').textContent = '';
    document.getElementById('tryonStatus').className = 'status-msg';
    if (clearResult) {
      document.getElementById('resultWrap').innerHTML = `
        <div class="image-placeholder">
          <div class="pi">✨</div>
          <p>衣服を選ぶと自動で試着します</p>
        </div>`;
    }
  }

  function resetTryon() {
    if (!originalPersonGcsUri) return;
    resetTryonState(true);
  }

  // ===== Applied chips =====
  function updateAppliedChips() {
    const el = document.getElementById('appliedChips');
    const chips = [];
    if (selectedTop)    chips.push(`<span class="applied-chip chip-top">トップス: ${selectedTop.label}</span>`);
    if (selectedBottom) chips.push(`<span class="applied-chip chip-bottom">ボトムス: ${selectedBottom.label}</span>`);
    el.innerHTML = chips.join('');
    el.style.display = chips.length ? '' : 'none';
  }

  // ===== Try-On =====
  async function runTryOn() {
    lockGarments();

    const both    = selectedTop && selectedBottom;
    const status  = document.getElementById('tryonStatus');
    const spinner = document.getElementById('spinner');
    status.textContent = both ? 'トップス→ボトムスの順に処理中... (最大2分)' : '試着処理中... (最大1分)';
    status.className = 'status-msg';
    spinner.classList.add('visible');

    document.getElementById('resultWrap').innerHTML = `
      <div style="width:100%;padding:24px;">
        <div class="skeleton" style="height:360px;border-radius:8px;"></div>
      </div>`;

    try {
      const body = { person_gcs_uri: originalPersonGcsUri };
      if (selectedTop)    body.top_gcs_uri    = selectedTop.gcsUri;
      if (selectedBottom) body.bottom_gcs_uri = selectedBottom.gcsUri;

      const res = await fetch('/api/tryon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
      const data = await res.json();

      document.getElementById('resultWrap').innerHTML =
        `<img class="compare-img" src="${data.result_url}" alt="試着後">`;

      status.textContent = '完了 — 衣服を変更・追加できます';
      updateAppliedChips();
      document.getElementById('btnReset').style.display = '';
      document.getElementById('chainHint').style.display = '';

    } catch (e) {
      status.textContent = `エラー: ${e.message}`;
      status.className = 'status-msg error';
      document.getElementById('resultWrap').innerHTML = `
        <div class="image-placeholder">
          <div class="pi">⚠️</div>
          <p>${e.message}</p>
        </div>`;
    } finally {
      spinner.classList.remove('visible');
      unlockGarments();
    }
  }
</script>
</body>
</html>
